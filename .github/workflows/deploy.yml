name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: figueiredoluiz/vitest-dedup
          path: vitest-dedup-source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/sync-docs.mjs
        env:
          VITEST_DEDUP_REPO: ${{ github.workspace }}/vitest-dedup-source
      - run: pnpm build
        env:
          SITE_URL: https://vitestdedup.dev
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy to Cloudflare Pages
        run: |
          pnpm exec wrangler pages deploy dist \
            --project-name=vitest-dedup-site \
            --branch="${{ github.head_ref || 'main' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
